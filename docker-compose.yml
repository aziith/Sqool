# Education Track Project Docker Setup
version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: education-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sqooluser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sqoolpass}
      POSTGRES_DB: ${DB_NAME:-sqooldb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service (Node.js/Express)
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: education-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://sqooluser:sqoolpass@db:5432/sqooldb?schema=public"
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - db
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend Service (React/Vite with Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: education-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
